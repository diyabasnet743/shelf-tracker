<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shelf Tracker – Sign In</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    :root {
      --login-accent:   #a07850;
      --login-accent-h: #7a5c3a;
      --login-text:     #2c2318;
      --login-muted:    #8c7b6a;
      --login-border:   rgba(160, 120, 80, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: var(--font-body);
      background: linear-gradient(160deg, #fdf6f0 0%, #f0f4fd 50%, #fdf0f8 100%);
      background-attachment: fixed;
      color: var(--login-text);
      display: flex;
      flex-direction: column;
    }

    /* ── Flower garland ── */
    .garland {
      width: 100%;
      text-align: center;
      font-size: 1.4rem;
      padding: 10px 0 4px;
      letter-spacing: 0.15em;
      line-height: 1;
      user-select: none;
      position: relative;
      z-index: 1;
    }

    /* Vine line through garland */
    .garland::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right,
        transparent 0%, rgba(160,120,80,0.2) 15%,
        rgba(160,120,80,0.2) 85%, transparent 100%);
      z-index: -1;
    }

    /* ── Main centered area ── */
    .auth-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── Card ── */
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow:
        0 4px 6px rgba(160,120,80,0.06),
        0 20px 60px rgba(160,120,80,0.14);
      padding: 40px 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    /* ── Logo ── */
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo img {
      height: 56px;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .auth-logo h1 {
      font-family: var(--font-head);
      font-size: 1.7rem;
      color: var(--login-accent);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .auth-logo h1 em { font-style: italic; font-weight: 400; }
    .auth-logo p {
      color: var(--login-muted);
      font-size: 0.85rem;
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--login-border);
    }
    .auth-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--login-muted);
      padding: 9px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: -1px;
    }
    .auth-tab.active {
      color: var(--login-accent);
      border-bottom-color: var(--login-accent);
    }
    .auth-tab:hover:not(.active) { color: var(--login-text); }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* ── Inputs ── */
    .auth-card .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .auth-card label {
      color: var(--login-muted);
      font-size: 0.76rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .auth-card input {
      background: #faf8f5;
      border: 1px solid var(--login-border);
      color: #1a202c;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 0.92rem;
      font-family: var(--font-body);
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-card input:focus {
      outline: none;
      border-color: var(--login-accent);
      box-shadow: 0 0 0 3px rgba(160,120,80,0.1);
    }
    .auth-card input::placeholder { color: #c0b0a0; }

    /* ── Button ── */
    .auth-submit {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      font-size: 0.92rem;
      border-radius: 8px;
      background: var(--login-accent);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: var(--font-body);
      letter-spacing: 0.04em;
    }
    .auth-submit:hover  { background: var(--login-accent-h); transform: translateY(-1px); }
    .auth-submit:active { transform: translateY(0); }

    /* ── Error ── */
    .auth-error {
      background: #fff5f5;
      border: 1px solid #f5c6c6;
      color: #b94040;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 0.83rem;
      margin-bottom: 14px;
      display: none;
      line-height: 1.5;
    }

    /* ── Bottom quote ── */
    .auth-quote {
      text-align: center;
      padding: 8px 20px 16px;
    }
    .auth-quote blockquote {
      font-family: var(--font-head);
      font-size: 0.95rem;
      font-style: italic;
      color: var(--login-muted);
      line-height: 1.5;
    }
    .auth-quote cite {
      display: block;
      font-size: 0.75rem;
      color: #b0a090;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
      font-style: normal;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px 24px; border-radius: 14px; }
      .garland { font-size: 1.1rem; letter-spacing: 0.08em; }
    }
  </style>
</head>
<body>

  <!-- ── Top flower garland ── -->
  <div class="garland">
    🌿 🌸 🌿 🌺 🌿 🌼 🌿 🌸 🌿 🌺 🌿 🌼 🌿 🌸 🌿 🌺 🌿 🌼 🌿 🌸 🌿
  </div>

  <!-- ── Centered card ── -->
  <div class="auth-center">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="/static/noun-books-shelf-4194571.png" alt="ShelfTracker logo" />
        <h1><em>Shelf</em>Tracker</h1>
        <p>Your personal reading library</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN -->
      <div id="login-form" class="auth-form active">
        <div id="login-error" class="auth-error"></div>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="reader@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="auth-submit" onclick="doLogin()">Sign In</button>
      </div>

      <!-- SIGNUP -->
      <div id="signup-form" class="auth-form">
        <div id="signup-error" class="auth-error"></div>
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input id="signup-username" type="text" placeholder="booklover42" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" />
        </div>
        <button class="auth-submit" onclick="doSignup()">Create Account</button>
      </div>

    </div>
  </div>

  <!-- ── Bottom quote + garland ── -->
  <div class="auth-quote">
    <blockquote>"A reader lives a thousand lives before he dies."</blockquote>
    <cite>— George R.R. Martin</cite>
  </div>
  <div class="garland" style="padding: 4px 0 12px;">
    🌿 🌼 🌿 🌺 🌿 🌸 🌿 🌼 🌿 🌺 🌿 🌸 🌿 🌼 🌿 🌺 🌿 🌸 🌿 🌼 🌿
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (API.getToken()) window.location.href = "/bookshelf";

    function switchTab(tab) {
      document.querySelectorAll(".auth-tab").forEach((t, i) => {
        t.classList.toggle("active", (i === 0) === (tab === "login"));
      });
      document.getElementById("login-form").classList.toggle("active", tab === "login");
      document.getElementById("signup-form").classList.toggle("active", tab === "signup");
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = "block";
    }

    async function doLogin() {
      document.getElementById("login-error").style.display = "none";
      const email    = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || !password) return showError("login-error", "Please fill in all fields.");
      try {
        const data = await API.login({ email, password });
        API.setToken(data.access_token);
        API.setUsername(data.username);
        window.location.href = "/bookshelf";
      } catch (e) {
        showError("login-error", e.message);
      }
    }

    async function doSignup() {
      document.getElementById("signup-error").style.display = "none";
      const username = document.getElementById("signup-username").value.trim();
      const email    = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      if (!username || !email || !password) return showError("signup-error", "Please fill in all fields.");
      try {
        const data = await API.signup({ username, email, password });
        API.setToken(data.access_token);
        API.setUsername(data.username);
        window.location.href = "/bookshelf";
      } catch (e) {
        showError("signup-error", e.message);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const loginActive = document.getElementById("login-form").classList.contains("active");
      loginActive ? doLogin() : doSignup();
    });
  </script>
</body>
</html>
